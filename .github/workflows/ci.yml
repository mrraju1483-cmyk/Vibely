name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run build                               # production build must succeed
      - run: node server/scripts/audit-project.js        # API calls, links, env vars and imports are consistent
      - run: node server/scripts/audit-secrets.js        # no secrets, no committed .env files

  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: find src scripts -name '*.js' -print0 | xargs -0 -n1 node --check   # syntax check every file
    # The smoke tests (npm run test:all) need MongoDB and a running server; run them locally or in a staging environment.

  ai-service:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ai-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: pytest
